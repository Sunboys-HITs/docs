name: Deploy documentation

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  repository_dispatch:
    types:
      - external-docs-updated

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs
        uses: actions/checkout@v4

      - name: Checkout Kubernetes docs
        uses: actions/checkout@v4
        with:
          repository: Sunboys-HITs/kubernetes-bootstrap
          ref: main
          path: external/kubernetes-bootstrap

      - name: Aggregate external docs
        run: |
          mkdir -p docs/kubernetes
          cp -R external/kubernetes-bootstrap/docs/. docs/kubernetes/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
