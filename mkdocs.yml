site_name: SUNBOYS Platform Documentation
site_description: Architecture and SRE documentation for the SUNBOYS autocheck platform
site_url: https://sunboys-hits.github.io/docs/
repo_name: Sunboys-HITs/docs
repo_url: https://github.com/Sunboys-HITs/docs

theme:
  name: material
  language: ru
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: blue

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Main Service: main-service.md
  - SRE Architecture: sre-architecture.md
  - Kubernetes:
      - K3s Bootstrap: kubernetes/k3s-bootstrap.md

extra_javascript:
  - https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js
